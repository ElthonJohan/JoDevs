<mat-toolbar color="primary" class="navbar-main">
  <div class="navbar-container">
    <!-- Logo - Siempre visible -->
    <a mat-button class="link-logo" routerLink="/" fragment="hero">
      <div class="logo-section" routerLink="/hero">
      <img src="code.png" alt="logo" class="logo-icon">

        <div class="logo-text-wrapper">
          <span class="logo-text"><span class="logo-text-jo">Jo</span>Devs</span>
          <span class="logo-subtitle">STARTUP • DESARROLLO</span>
        </div> 
      </div>
    </a>

    <!-- Menú Desktop - Solo visible en desktop -->
    <div class="desktop-menu">
      <a mat-button routerLink="/" fragment="servicios" class="nav-link">Servicios</a>
      <a mat-button routerLink="/" fragment="trabajos" class="nav-link">Trabajos</a>
      <a mat-button routerLink="/" fragment="nosotros" class="nav-link">Acerca de</a>
      <a mat-button routerLink="/" fragment="contacto" class="nav-link">Contacto</a>
      <a mat-button routerLink="/blog" fragment="blog" class="nav-link">Blog</a>
    </div>

    <!-- Acciones derecha - Siempre visibles pero diferentes en móvil/desktop -->
    <div class="actions-section">
      <!-- Botón CONTACT - Solo visible en desktop -->
      <button mat-raised-button class="contact-button desktop-only">
        Start Project
        <mat-icon>arrow_forward</mat-icon>
      </button>

      <!-- Botón Hamburguesa - Solo visible en móvil -->
      <button mat-icon-button class="hamburger-btn mobile-only" (click)="toggleMenu()">
        <mat-icon>{{ showMenu ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>
  </div>

  <!-- Menú Móvil Overlay -->
  <div *ngIf="showMenu" class="mobile-menu-wrapper">
    <div class="mobile-overlay" (click)="closeMenu()"></div>
    <div class="mobile-menu-panel">
      <a mat-button routerLink="/" fragment="servicios" (click)="closeMenu()">Servicios</a>
      <a mat-button routerLink="/" fragment="trabajos" (click)="closeMenu()">Trabajos</a>
      <a mat-button routerLink="/" fragment="nosotros" (click)="closeMenu()">Acerca de</a>
      <a mat-button routerLink="/" fragment="contacto" (click)="closeMenu()">Contacto</a>
      <a mat-button routerLink="/blog" fragment="blog" (click)="closeMenu()">Blog</a>

      <button mat-raised-button class="mobile-contact-btn" (click)="closeMenu()">Start Project</button>
    </div>
  </div>
</mat-toolbar>

<!-- Aquí se renderiza el contenido -->
<div class="p-2 md:p-6">
  <router-outlet></router-outlet>
</div>
