<section class="project-detail">
  <div class="overlay"></div>

  <div class="container">
    <div class="hero">
      <div class="hero-text">
        <span class="tag"> Proyecto Destacado </span>

        <h1>
          {{ project?.title }}
        </h1>

        <p>
          {{ project?.description }}
        </p>

        <div class="tech-list">
          <span *ngFor="let tech of project?.technologies">
            {{ tech }}
          </span>
        </div>
      </div>

      <div class="project-mockup">
        <div class="carousel-container">
          <div class="slides" [style.transform]="'translateX(' + currentIndex * -100 + '%)'">
            <img
              *ngFor="let img of project?.images"
              [src]="img"
              [alt]="'Proyecto ' + (project?.images.indexOf(img) + 1)"
              class="slide-image"
            />
          </div>
        </div>

        <!-- Botones de navegación -->
        <button class="nav-btn prev" (click)="prevImage()" *ngIf="project?.images?.length > 1">
          ‹
        </button>
        <button class="nav-btn next" (click)="nextImage()" *ngIf="project?.images?.length > 1">
          ›
        </button>

        <!-- Indicadores -->
        <div class="dots" *ngIf="project?.images?.length > 1">
          <span
            *ngFor="let _ of project.images; let i = index"
            class="dot"
            [class.active]="i === currentIndex"
            (click)="goToImage(i)"
          >
          </span>
        </div>
      </div>
    </div>

    <div class="content-grid">
      <div class="card">
        <h2>El desafío</h2>

        <p>
          {{ project?.challenge }}
        </p>
      </div>

      <div class="card">
        <h2>La solución</h2>

        <p>
          {{ project?.solution }}
        </p>
      </div>
    </div>

    <div class="features">
      <h2>Características principales</h2>

      <div class="feature-grid">
        <div class="feature-card" *ngFor="let feature of project?.features">
          {{ feature }}
        </div>
      </div>
    </div>
  </div>
</section>
