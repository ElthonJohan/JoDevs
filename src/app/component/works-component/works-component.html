<section class="project-detail">

  <div class="overlay"></div>

  <div class="container">

    <div class="hero">

      <div class="hero-text">

        <span class="tag">
          Proyecto Destacado
        </span>

        <h1>
          {{ project?.title }}
        </h1>

        <p>
          {{ project?.description }}
        </p>

        <div class="tech-list">
          <span *ngFor="let tech of project?.technologies">
            {{ tech }}
          </span>
        </div>

      </div>

      <div class="hero-image">

        <img [src]="project?.image" alt="project image">

      </div>

    </div>

    <div class="content-grid">

      <div class="card">

        <h2>El desafío</h2>

        <p>
          {{ project?.challenge }}
        </p>

      </div>

      <div class="card">

        <h2>La solución</h2>

        <p>
          {{ project?.solution }}
        </p>

      </div>

    </div>

    <div class="features">

      <h2>Características principales</h2>

      <div class="feature-grid">

        <div class="feature-card"
             *ngFor="let feature of project?.features">

          {{ feature }}

        </div>

      </div>

    </div>

  </div>

</section>
